name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Compile-check all sources
        run: |
          python -m compileall -q \
            proxy-orchestrator/engine \
            proxy-orchestrator/gateway \
            proxy-orchestrator/services \
            proxy-orchestrator/strategies \
            proxy-orchestrator/scripts \
            Lib++/core Lib++/strategies Lib++/adapters Lib++/engine Lib++/processors

  smoke:
    name: Import smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: |
            proxy-orchestrator/requirements.txt
            Lib++/requirements.txt

      - name: Install Lib++ (editable, like Dockerfile)
        run: pip install -e ./Lib++

      - name: Install orchestrator deps (requirements.txt, like Dockerfile)
        run: pip install -r proxy-orchestrator/requirements.txt

      - name: Import smoke test (runtime layout, like /app)
        run: |
          export PYTHONPATH="$(pwd)/proxy-orchestrator:$(pwd)/Lib++:$PYTHONPATH"
          python -c "import config; print('config ok')"
          python -c "import Lib_plus_plus; print('Lib_plus_plus', Lib_plus_plus.__file__)"
          python -c "import services.cookie_jar; print('cookie_jar ok')"
          python -c "import services.rate_limiter; print('rate_limiter ok')"
          python -c "import strategies.simple; print('simple ok')"
          python -c "import strategies.gui_chrome; print('gui_chrome ok')"
          python -c "import gateway.rest_api; print('rest_api ok')"
          python -c "import engine.decision_engine; print('decision_engine ok')"

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build image
        run: |
          docker compose -f proxy-orchestrator/docker-compose.yml config --quiet
          docker build --file proxy-orchestrator/Dockerfile -t proxify:ci .

      - name: Verify entrypoint imports
        run: |
          docker run --rm proxify:ci python -c "import main; print('main ok')"

services:
  # ============================================
  # 1. Proxify — Main Gateway
  # ============================================
  orchestrator:
    build:
      context: ..
      dockerfile: proxy-orchestrator/Dockerfile
    container_name: proxy-orchestrator
    ports:
      - "8888:8888" # Proxy Port
      - "8080:8080" # API Port
    environment:
      - REDIS_URL=redis://redis:6379/0
      - REDIS_ENABLED=true
      - FLARESOLVERR_URL=http://flaresolverr:8191/v1
      - FLARESOLVERR_ENABLED=true
      - LOG_LEVEL=INFO
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      - TZ=UTC
    depends_on:
      - redis
      - flaresolverr
    volumes:
      - .certs:/.certs
    # Chromium needs a large /dev/shm; default 64MB causes browser crashes
    # (crashes/restarts are themselves detectable by anti-bot systems).
    shm_size: 1gb
    # Reap zombie Chromium processes so they never accumulate.
    init: true
    restart: unless-stopped

  # ============================================
  # 2. FlareSolverr — Cloudflare Challenge Solver
  # ============================================
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: proxy-flaresolverr
    ports:
      - "8191:8191"
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - TZ=UTC
      - HEADLESS=true
    restart: unless-stopped


  # ============================================
  # 3. Redis — L2 Cache Persistence
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: proxy-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:

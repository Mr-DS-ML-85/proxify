services:
  # ============================================
  # 1. Proxify — Main Gateway
  # ============================================
  orchestrator:
    build:
      context: ..
      dockerfile: proxy-orchestrator/Dockerfile
    container_name: proxy-orchestrator
    ports:
      # HTTP CONNECT proxy. The server binds PROXY_PORT (default 8888) inside
      # the container, so the mapping must target 8888 — the previous 8889:8889
      # published nothing.
      - "8888:8888"
      # REST API. API_PORT defaults to 8080 inside the container. Host 8081 is
      # used because 9090 on the host is held by searchos-prometheus, which is
      # what left the orchestrator "unhealthy" while it was actually serving.
      - "8081:8080"
    environment:
      - REDIS_URL=redis://redis:6379/0
      - REDIS_ENABLED=true
      - FLARESOLVERR_URL=http://flaresolverr:8191/v1
      - FLARESOLVERR_ENABLED=true
      - LOG_LEVEL=INFO
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      - TZ=UTC
    depends_on:
      - redis
      - flaresolverr
    volumes:
      - .certs:/.certs
    # Chromium needs a large /dev/shm; default 64MB causes browser crashes
    # (crashes/restarts are themselves detectable by anti-bot systems).
    shm_size: 1gb
    # Reap zombie Chromium processes so they never accumulate.
    init: true
    restart: unless-stopped

  # ============================================
  # 2. FlareSolverr — Cloudflare Challenge Solver
  # ============================================
  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: proxy-flaresolverr
    ports:
      - "8191:8191"
    environment:
      - LOG_LEVEL=info
      - LOG_HTML=false
      - TZ=UTC
      - HEADLESS=true
    restart: unless-stopped


  # ============================================
  # 3. Redis — L2 Cache Persistence
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: proxy-redis
    # No host port mapping on purpose — a native redis-server already occupies
    # 127.0.0.1:6379 on the host. The orchestrator talks to redis over the
    # compose network (redis://redis:6379), so publishing a host port is
    # unnecessary and only causes a bind conflict.
    volumes:
      - redis_data:/data
    restart: unless-stopped

volumes:
  redis_data:

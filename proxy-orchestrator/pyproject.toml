[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "proxify"
version = "1.0.0"
description = "Proxify — Anti-Bot Bypass Gateway & Web Fetcher Toolkit"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.104.0",
    "uvicorn[standard]>=0.24.0",
    "httpx[http2]>=0.25.0",
    "scrapling[fetchers]>=0.2.0",
    "redis[hiredis]>=5.0.0",
    "prometheus-client>=0.19.0",
    "websockets>=12.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.0.0",
    "cryptography>=41.0.7",
    "cachetools>=5.3.2",
    "pyrate-limiter>=3.1.0",
    "playwright>=1.40.0",
    "playwright-stealth>=1.0.6",
    "drissionpage>=4.0.0",
    "httpx-curl-cffi>=0.1.5",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.25.0",
]

[project.scripts]
proxy-orchestrator = "main:main"

[tool.setuptools]
packages = ["engine", "gateway", "services", "strategies"]
